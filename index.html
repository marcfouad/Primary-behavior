function render(){renderTabs();let q=search.value.trim();let list=classes[current].filter(n=>n.includes(q));students.innerHTML=`<div class="classhead"><b>${current}</b><span>${list.length} طالب</span></div>`+list.map(n=>`<div class="card student"><div style="flex:1" onclick="openStudent('${n.replaceAll("'","&#39;")}')"><div class="student-name">${n}</div><small>اضغط على الاسم لعرض السجل</small></div><div class="student-actions"><span class="badge">${countNotes(n)} ملاحظة</span><button class="addnote" onclick="event.stopPropagation();openNewFor('${encodeURIComponent(n)}','${current}')">+ ملاحظة</button></div></div>`).join('')}
search.oninput=render;
function openStudent(name){studentTitle.textContent=name;let ns=notes.filter(n=>n.students.some(s=>s.name===name)).sort((a,b)=>b.ts-a.ts);timeline.innerHTML=ns.length?ns.map(n=>`<div class="card note ${n.status==='تم الحل'?'done':n.follow==='yes'?'open':''}"><b>${n.type}</b> • <small>${new Date(n.ts).toLocaleString('ar-EG')}</small><p>${n.note}</p><div class="chips">${n.students.map(s=>`<span class="chip">${s.name} • ${s.cls}</span>`).join('')}</div><small>✍️ ${n.author||'غير محدد'}${n.follow==='yes'?' • 👤 '+(n.owner||'غير محدد')+' • '+n.status:''}</small>${n.follow==='yes'&&n.status!=='تم الحل'?`<button class="primary" style="margin-top:10px" onclick="resolve('${n.id}')">✓ تم الحل</button>`:''}</div>`).join(''):'<div class="empty">لا توجد ملاحظات لهذا الطالب.</div>';studentModal.classList.add('show')}
function resolve(id){let n=notes.find(x=>x.id===id);n.status='تم الحل';persistNotes();openStudent(studentTitle.textContent);render()}
function openNew(){picked=[];note.value='';owner.value='';task.value='';pickSearch.value='';newModal.classList.add('show');renderPick()}
function openNewFor(name,cls){openNew();picked=[{name:decodeURIComponent(name),cls}];renderPick()}
function closeM(id){document.getElementById(id).classList.remove('show')}
pickSearch.oninput=renderPick; follow.onchange=()=>followFields.style.display=follow.value==='yes'?'block':'none';
function renderPick(){let q=pickSearch.value.trim();let arr=allStudents().filter(s=>!picked.some(p=>p.name===s.name)&&(!q||s.name.includes(q))).slice(0,12);pickResults.innerHTML=arr.map((s,i)=>`<div class="card student" onclick="addPick('${encodeURIComponent(s.name)}','${s.cls}')"><span>${s.name}</span><span class="badge">${s.cls} +</span></div>`).join('');document.getElementById('picked').innerHTML=picked.map((s,i)=>`<span class="chip" onclick="picked.splice(${i},1);renderPick()">${s.name} • ${s.cls} ✕</span>`).join('')}
function addPick(name,cls){picked.push({name:decodeURIComponent(name),cls});pickSearch.value='';renderPick()}
function saveNote(){if(!picked.length||!note.value.trim()){alert('اختر طالبًا واحدًا على الأقل واكتب الملاحظة');return}notes.push({id:Date.now().toString(),ts:Date.now(),students:[...picked],type:type.value,note:note.value.trim(),author:author.value.trim(),follow:follow.value,owner:owner.value.trim(),task:task.value.trim(),status:follow.value==='yes'?'جديدة':'—'});persistNotes();closeM('newModal');render();alert('تم حفظ الملاحظة في النسخة التجريبية')} 
try{render()}catch(e){
  document.getElementById('students').innerHTML='<div class="card"><b>حدث خطأ في تحميل القائمة.</b><br><small>'+e.message+'</small></div>';
}
</script></body></html>
