<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>متابعة سلوك المرحلة الابتدائية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6fa;color:#172033}
header{background:#fff;padding:16px;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:4}
.wrap{max-width:900px;margin:auto;padding:12px}h1{font-size:21px;margin:0 0 4px}.muted{color:#6b7280;font-size:13px}
.row{display:flex;gap:8px;overflow:auto;margin:10px 0}.btn,.tab{border:0;border-radius:12px;padding:11px 15px;font-weight:700;white-space:nowrap;background:#e7ebf4;color:#1f2937}
.on,.primary{background:#27457d!important;color:#fff!important}.search,select,input,textarea{width:100%;padding:12px;border:1px solid #d8deea;border-radius:12px;background:#fff;font-size:16px}
.card{background:#fff;border-radius:15px;padding:13px;margin:9px 0;box-shadow:0 2px 10px #0000000c}.student{display:flex;align-items:center;gap:8px}.name{flex:1;font-weight:700;line-height:1.5}
.mini{border:0;border-radius:10px;padding:9px 10px;background:#27457d;color:#fff}.danger{background:#a83232;color:#fff}.outline{background:#fff;border:1px solid #ccd4e2;color:#25324a}
.count{background:#edf1f7;border-radius:20px;padding:5px 8px;font-size:12px}.fab{position:fixed;left:22px;bottom:24px;width:58px;height:58px;border:0;border-radius:50%;background:#27457d;color:#fff;font-size:28px;box-shadow:0 7px 20px #0003}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;overflow:auto;padding:12px}.modal.show{display:block}.sheet{max-width:620px;margin:18px auto;background:#fff;border-radius:18px;padding:15px}
.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.chip{display:inline-block;background:#e8eef9;padding:7px 9px;border-radius:18px;margin:3px;font-size:13px}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.managebar{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.managebar h3{margin:0}
</style></head>
<body>
<header><div class="wrap"><h1>متابعة سلوك المرحلة الابتدائية</h1><div class="muted">الصفوف الأول والثاني والثالث</div></div></header>
<main class="wrap">
<div id="grades" class="row"></div><div id="classes" class="row"></div>
<input id="search" class="search" placeholder="🔎 ابحث باسم الطالب...">
<div class="managebar"><h3 id="classTitle">تحميل الأسماء...</h3><button class="btn outline" onclick="openManage()">⚙️ إدارة الطلاب</button></div>
<div id="students"></div></main><button class="fab" onclick="openIncident()">+</button>

<div id="incident" class="modal"><div class="sheet"><button class="btn outline" onclick="closeM('incident')">رجوع</button><h2>إضافة ملاحظة</h2>
<div class="field"><label>الطلاب المرتبطون بالملاحظة</label><div id="picked"></div></div><hr><b>إضافة طالب آخر</b>
<div class="field"><label>الصف</label><select id="ig"></select></div>
<div class="field"><label>الفصل</label><select id="ic"></select></div>
<div class="field"><label>الطالب</label><select id="is"></select></div>
<button class="btn outline" onclick="addPicked()">+ إضافة الطالب</button>
<div class="field"><label>الملاحظة</label><textarea id="note" rows="4"></textarea></div>
<div class="field"><label>كاتب الملاحظة</label><input id="author"></div>
<div class="field"><label>تحتاج متابعة؟</label><select id="follow"><option>لا</option><option>نعم</option></select></div>
<div class="field"><label>المسؤول عن المتابعة</label><input id="owner"></div>
<button class="btn primary" style="width:100%" onclick="saveIncident()">حفظ الملاحظة</button></div></div>

<div id="manage" class="modal"><div class="sheet"><button class="btn outline" onclick="closeM('manage')">رجوع</button><h2>إدارة الطلاب</h2>
<div id="manageWhere" class="muted"></div><div class="field"><label>إضافة طالب للفصل الحالي</label><input id="newName" placeholder="اسم الطالب"></div>
<button class="btn primary" style="width:100%" onclick="addStudent()">+ إضافة الطالب</button><hr>
<div class="field"><label>طالب موجود</label><select id="manageStudent"></select></div>
<div class="field"><label>نقل إلى</label><select id="moveClass"></select></div>
<div class="actions"><button class="btn primary" onclick="moveStudent()">نقل الطالب</button><button class="btn danger" onclick="deleteStudent()">حذف الطالب</button></div>
<div class="muted" style="margin-top:10px">إضافة/حذف/نقل الأسماء في النسخة التجريبية محفوظ على الجهاز الحالي.</div></div></div>

<script>
const SHEETS={"1": "19J0sgGRHh4H-UHAoUgXhGZdvaMsNHLQE5TwyWSNfPEQ", "2": "1JiY9xUplAPGIbdapTxSO_8AgkoZEbB3hnU7m4asnYDE", "3": "1jO02WV38W2iqhuXTs3PY4GdJZFUw5Xr3W019URIeviU"};
let roster={},grade='1',cls='1A',picked=[],notes=[];
const letters=['A','B','C','D','E'],$=x=>document.getElementById(x);
try{notes=JSON.parse(localStorage.getItem('primary_notes_v3')||'[]')}catch(e){}
function saved(){try{return JSON.parse(localStorage.getItem('primary_roster_v3')||'null')}catch(e){return null}}
async function load(){
 let local=saved(); if(local){roster=local;render();return}
 for(const g of ['1','2','3'])for(const l of letters){
  const c=g+l;
  try{
   const u='https://docs.google.com/spreadsheets/d/'+SHEETS[g]+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(c)+'&range=A2:A80';
   const t=await fetch(u).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});
   roster[c]=t.split(/\r?\n/).map(x=>x.replace(/^"|"$/g,'').replace(/""/g,'"').trim()).filter(Boolean);
  }catch(e){roster[c]=[]}
 }
 persistRoster();render()
}
function persistRoster(){try{localStorage.setItem('primary_roster_v3',JSON.stringify(roster))}catch(e){}}
function render(){
 $('grades').innerHTML=['1','2','3'].map(g=>'<button class="tab '+(g==grade?'on':'')+'" onclick="setGrade(\\''+g+'\\')">الصف '+({'1':'الأول','2':'الثاني','3':'الثالث'}[g])+'</button>').join('');
 $('classes').innerHTML=letters.map(l=>{let c=grade+l;return '<button class="tab '+(c==cls?'on':'')+'" onclick="cls=\\''+c+'\\';render()">'+c+'</button>'}).join('');
 let q=$('search').value.trim(),a=(roster[cls]||[]).filter(n=>n.includes(q));$('classTitle').textContent=cls+' — '+a.length+' طالب';
 $('students').innerHTML=a.length?a.map(n=>'<div class="card student"><div class="name">'+esc(n)+'</div><span class="count">'+count(n,cls)+' ملاحظة</span><button class="mini" onclick="openFor(\\''+encodeURIComponent(n)+'\\',\\''+cls+'\\')">+ ملاحظة</button></div>').join(''):'<div class="card">لا توجد أسماء محمّلة في هذا الفصل.</div>'
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function setGrade(g){grade=g;cls=g+'A';render()} function count(n,c){return notes.filter(x=>x.students?.some(s=>s.name==n&&s.cls==c)).length}
function openFor(n,c){picked=[{name:decodeURIComponent(n),cls:c}];openIncident(false)}
function openIncident(clear=true){if(clear)picked=[];$('incident').classList.add('show');$('ig').innerHTML=['1','2','3'].map(g=>'<option value="'+g+'">الصف '+({'1':'الأول','2':'الثاني','3':'الثالث'}[g])+'</option>').join('');$('ig').value=grade;fillClasses();drawPicked()}
function fillClasses(){$('ic').innerHTML=letters.map(l=>'<option value="'+$('ig').value+l+'">'+$('ig').value+l+'</option>').join('');fillStudents()}
function fillStudents(){$('is').innerHTML=(roster[$('ic').value]||[]).map(n=>'<option>'+esc(n)+'</option>').join('')}
$('ig').onchange=fillClasses;$('ic').onchange=fillStudents;
function addPicked(){let n=$('is').value,c=$('ic').value;if(n&&!picked.some(x=>x.name==n&&x.cls==c)){picked.push({name:n,cls:c});drawPicked()}}
function drawPicked(){$('picked').innerHTML=picked.length?picked.map((x,i)=>'<span class="chip">'+esc(x.name)+' • '+x.cls+' <b onclick="picked.splice('+i+',1);drawPicked()">×</b></span>').join(''):'<span class="muted">لم يتم اختيار طالب</span>'}
function saveIncident(){if(!picked.length||!$('note').value.trim()){alert('اختر طالبًا واكتب الملاحظة');return}notes.push({id:Date.now(),students:[...picked],note:$('note').value.trim(),author:$('author').value.trim(),follow:$('follow').value,owner:$('owner').value.trim(),date:new Date().toLocaleString('ar-EG')});try{localStorage.setItem('primary_notes_v3',JSON.stringify(notes))}catch(e){};$('note').value='';closeM('incident');render();alert('تم حفظ الملاحظة')}
function openManage(){$('manage').classList.add('show');$('manageWhere').textContent='الفصل الحالي: '+cls;refreshManage()}
function refreshManage(){$('manageStudent').innerHTML=(roster[cls]||[]).map(n=>'<option>'+esc(n)+'</option>').join('');$('moveClass').innerHTML=Object.keys(roster).filter(c=>c!=cls).map(c=>'<option>'+c+'</option>').join('')}
function addStudent(){let n=$('newName').value.trim();if(!n)return;if((roster[cls]||[]).includes(n)){alert('الاسم موجود بالفعل');return}roster[cls].push(n);persistRoster();$('newName').value='';refreshManage();render()}
function deleteStudent(){let n=$('manageStudent').value;if(n&&confirm('حذف '+n+' من '+cls+'؟')){roster[cls]=roster[cls].filter(x=>x!=n);persistRoster();refreshManage();render()}}
function moveStudent(){let n=$('manageStudent').value,to=$('moveClass').value;if(n&&to&&confirm('نقل '+n+' إلى '+to+'؟')){roster[cls]=roster[cls].filter(x=>x!=n);roster[to]=roster[to]||[];if(!roster[to].includes(n))roster[to].push(n);persistRoster();refreshManage();render()}}
function closeM(id){$(id).classList.remove('show')}$('search').oninput=render;load();
</script></body></html>
